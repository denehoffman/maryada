[package]
name = "maryada"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "No-std binary64 real interval arithmetic conforming to IEEE 1788.1"
documentation = "https://docs.rs/maryada"
readme = "README.md"
repository = "https://github.com/denehoffman/maryada"
license = "MIT OR Apache-2.0"
keywords = ["interval", "arithmetic", "ieee-1788", "numerics", "no-std"]
categories = ["mathematics", "no-std", "science"]

[dependencies]
libm = { version = "=0.2.16", default-features = false }
nalgebra = { version = "0.35.0", default-features = false, optional = true, features = ["libm"] }
num-complex = { version = "0.4.6", default-features = false, optional = true }

[features]
default = []
alloc = ["nalgebra?/alloc"]
complex = []
num-complex = ["complex", "dep:num-complex"]
linalg = ["dep:nalgebra"]

[[example]]
name = "linalg"
required-features = ["linalg"]

[lints.rust]
missing_docs = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
float_cmp = "allow"

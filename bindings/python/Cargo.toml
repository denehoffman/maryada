[package]
name = "maryada-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Python bindings for maryada"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
maryada = { path = "../..", features = ["num-complex"] }
num-complex = "0.4.6"
pyo3 = { version = "0.30.1", features = ["abi3-py311", "num-complex"] }

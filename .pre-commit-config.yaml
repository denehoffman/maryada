default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: yamloom-sync
        name: Sync GitHub workflows with Yamloom
        entry: yamloom sync
        language: system
        pass_filenames: false
        always_run: true

      - id: cargo-fmt
        name: Check Rust formatting
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        always_run: true

      - id: cargo-clippy
        name: Run Clippy
        entry: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        language: system
        pass_filenames: false
        always_run: true

      - id: cargo-test
        name: Run Rust tests
        entry: cargo test --workspace --all-features --locked
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages:
          - commit-msg
